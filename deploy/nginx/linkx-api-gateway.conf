# Linkx API Gateway Nginx template
# Replace linkx_backend upstream host/port with the backend address for your environment.
# Backend remains the source of truth for JWT/RBAC validation.

upstream linkx_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name linkx-api.local;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health endpoint can be exposed for load balancers.
    location = /db/health {
        proxy_pass http://linkx_backend;
    }

    # Authentication endpoints.
    location = /auth/auto-login {
        proxy_pass http://linkx_backend;
    }

    location = /auth/auto_login {
        proxy_pass http://linkx_backend;
    }

    location = /auth/login {
        proxy_pass http://linkx_backend;
    }

    location = /auth/service-token {
        proxy_pass http://linkx_backend;
    }

    # Parent gateway only. Restrict this route to parent gateway networks in production.
    location = /auth/parent-token {
        # Example allow-list. Adjust or remove for your environment.
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # deny all;
        proxy_set_header X-Linkx-Parent-Secret $http_x_linkx_parent_secret;
        proxy_pass http://linkx_backend;
    }

    # JWT-protected auth/admin APIs. Backend validates Authorization: Bearer <JWT>.
    location ^~ /auth/admin/ {
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://linkx_backend;
    }

    location = /auth/me {
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://linkx_backend;
    }

    location = /auth/verify {
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://linkx_backend;
    }

    # JWT-protected Linkx session initializer.
    location = /init {
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://linkx_backend;
    }

    # Public/partner STR endpoint. Backend optionally validates X-API-Key when configured.
    location = /api/STR_link_analysis {
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_pass http://linkx_backend;
    }

    # Socket.IO transport. Backend validates token from the Socket.IO auth payload.
    location /socket.io/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://linkx_backend;
    }

    # Optional: forward remaining backend routes after JWT validation in backend.
    location / {
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://linkx_backend;
    }
}
