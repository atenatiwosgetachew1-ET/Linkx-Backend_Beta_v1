services:
  postgres:
    image: postgres:16
    container_name: linkx-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - linkx_postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkx -d linkx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: linkx-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - linkx_redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  linkx_postgres_data:
  linkx_redis_data:
