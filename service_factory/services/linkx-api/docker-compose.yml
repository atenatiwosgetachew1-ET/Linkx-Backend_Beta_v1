services:
  linkx-api:
    build: .
    env_file:
      - .env
    ports:
      - "8100:8100"
    volumes:
      - linkx_api_artifacts:/mnt/linkx-artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/db/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  linkx_api_artifacts:
