# LinkX Centralized Alerting Rules for Prometheus Alertmanager

groups:
  - name: linkx_infrastructure_alerts
    rules:
      # Host Availability
      - alert: LinkXNodeDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LinkX node {{ $labels.instance }} is unreachable"
          description: "Prometheus exporter on host {{ $labels.instance }} (cluster: {{ $labels.cluster }}) has been down for over 1 minute."

      # Host High CPU Usage
      - alert: LinkXHighCPUUsage
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU utilization on {{ $labels.instance }} is above 85% for more than 5 minutes."

      # Host Disk Running Low
      - alert: LinkXLowDiskSpace
        expr: ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"}) < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Root partition free space on {{ $labels.instance }} has dropped below 15%."

      - alert: LinkXCriticalDiskSpace
        expr: ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"}) < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Near-full disk space on {{ $labels.instance }}"
          description: "Root partition free space on {{ $labels.instance }} has dropped below 5%."

  - name: linkx_database_and_services
    rules:
      # Neo4j Heap Usage
      - alert: LinkXNeo4jHeapCritical
        expr: (neo4j_jvm_memory_used_bytes{area="heap"} / neo4j_jvm_memory_max_bytes{area="heap"}) * 100 > 90
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Neo4j Heap memory exceeds 90%"
          description: "Graph database JVM heap on {{ $labels.instance }} is above 90% for 3 minutes."

      # Redis Memory Usage
      - alert: LinkXRedisMemoryHigh
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory utilization high"
          description: "Redis broker on {{ $labels.instance }} is consuming over 80% of maxmemory."

      # Worker Job Processing Latency / Queue Backlog
      - alert: LinkXWorkerQueueBacklog
        expr: linkx_worker_queue_length > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Worker job queue backlog growing"
          description: "Pending jobs in queue on {{ $labels.instance }} exceed 100 for more than 10 minutes."
